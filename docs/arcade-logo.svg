<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="103 Arcade Gaming Division">
  <defs>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="35%" stop-color="#ff8c00"/>
      <stop offset="55%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <linearGradient id="arcadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="45%" stop-color="#6b5cff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8494"/>
      <stop offset="40%" stop-color="#2a303a"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="discGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1a2740"/>
      <stop offset="70%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <pattern id="hex" width="22" height="38" patternUnits="userSpaceOnUse">
      <path d="M11 1 L21 7 V19 L11 25 L1 19 V7 Z" fill="none" stroke="#1e3a55" stroke-width="1" opacity="0.55"/>
      <path d="M11 20 L21 26 V38 L11 44 L1 38 V26 Z" fill="none" stroke="#1e3a55" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textLift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <clipPath id="discClip">
      <circle cx="256" cy="256" r="198"/>
    </clipPath>
  </defs>

  <!-- Outer metal ring -->
  <circle cx="256" cy="256" r="236" fill="url(#metalGrad)" stroke="#9aa3b2" stroke-width="3"/>
  <circle cx="256" cy="256" r="224" fill="#0b0e14" stroke="#3a4250" stroke-width="2"/>

  <!-- Neon ring pair -->
  <g filter="url(#glowStrong)">
    <circle cx="256" cy="256" r="214" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="150 18" transform="rotate(-20 256 256)"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ringGrad)" stroke-width="5" opacity="0.85"
            stroke-dasharray="90 14" transform="rotate(12 256 256)"/>
  </g>

  <!-- Metal brackets -->
  <g fill="#1a1f28" stroke="#8b95a5" stroke-width="2">
    <path d="M236 34 h40 l8 18 h-56 z"/>
    <path d="M236 460 h40 l-8 18 h-24 z"/>
    <path d="M34 236 v40 l18 8 v-56 z"/>
    <path d="M460 236 v40 l-18 8 v-56 z"/>
  </g>

  <!-- Inner disc -->
  <circle cx="256" cy="256" r="190" fill="url(#discGlow)" stroke="#2a3550" stroke-width="2"/>
  <g clip-path="url(#discClip)">
    <rect x="58" y="58" width="396" height="396" fill="url(#hex)"/>
    <circle cx="256" cy="210" r="120" fill="#00e5ff" opacity="0.06"/>
  </g>

  <!-- 103 -->
  <g filter="url(#textLift)">
    <text x="256" y="188" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Impact, sans-serif"
          font-size="118" font-weight="900" letter-spacing="-4" fill="#0a0a0a">103</text>
    <text x="256" y="184" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Impact, sans-serif"
          font-size="118" font-weight="900" letter-spacing="-4" fill="url(#numGrad)" filter="url(#glowSoft)">103</text>
  </g>

  <!-- ARCADE -->
  <g filter="url(#textLift)">
    <text x="256" y="248" text-anchor="middle" font-family="Segoe UI, Arial Black, Impact, sans-serif"
          font-size="46" font-weight="800" letter-spacing="6" fill="#0a0a0a">ARCADE</text>
    <text x="256" y="245" text-anchor="middle" font-family="Segoe UI, Arial Black, Impact, sans-serif"
          font-size="46" font-weight="800" letter-spacing="6" fill="url(#arcadeGrad)" filter="url(#glowSoft)">ARCADE</text>
  </g>

  <!-- GAMING DIVISION -->
  <g stroke="#e8eef8" stroke-width="1.5" opacity="0.9">
    <line x1="118" y1="278" x2="168" y2="278"/>
    <line x1="344" y1="278" x2="394" y2="278"/>
  </g>
  <text x="256" y="284" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, Arial, sans-serif"
        font-size="14" font-weight="700" letter-spacing="3.5" fill="#f4f7ff">GAMING DIVISION</text>

  <!-- Controller -->
  <g transform="translate(256 360)" filter="url(#glowStrong)" fill="none" stroke="url(#padGrad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-70 -8
             C-70 -28 -52 -38 -28 -38
             H28
             C52 -38 70 -28 70 -8
             V10
             C70 28 54 38 34 38
             H18
             L8 28
             H-8
             L-18 38
             H-34
             C-54 38 -70 28 -70 10
             Z"/>
    <!-- D-pad -->
    <path d="M-42 -6 h10 v-10 h10 v10 h10 v10 h-10 v10 h-10 v-10 h-10 z" stroke-width="3"/>
    <!-- Center pills -->
    <rect x="-8" y="-4" width="8" height="5" rx="2.5" stroke-width="2.5"/>
    <rect x="2" y="-4" width="8" height="5" rx="2.5" stroke-width="2.5"/>
    <!-- Face buttons -->
    <circle cx="34" cy="-14" r="4.5" stroke-width="3"/>
    <circle cx="46" cy="-2" r="4.5" stroke-width="3"/>
    <circle cx="34" cy="10" r="4.5" stroke-width="3"/>
    <circle cx="22" cy="-2" r="4.5" stroke-width="3"/>
  </g>
</svg>
