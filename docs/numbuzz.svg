<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="nbTitle">
  <title id="nbTitle">NumBuzz</title>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0030"/>
      <stop offset="100%" stop-color="#001a24"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#32cd32"/>
    </linearGradient>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M6 0H0V6" fill="none" stroke="#00ffff" stroke-opacity="0.22" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect x="38" y="28" width="164" height="184" rx="22" fill="url(#face)" stroke="#ffff00" stroke-width="4" filter="url(#glow)"/>
  <rect x="38" y="28" width="164" height="184" rx="22" fill="url(#grid)"/>

  <rect x="58" y="46" width="124" height="48" rx="10" fill="#05050a" stroke="#00ffff" stroke-width="3" filter="url(#softGlow)"/>
  <text x="120" y="80" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="800" fill="url(#screen)">7x8</text>

  <g filter="url(#glow)">
    <rect x="58" y="112" width="36" height="28" rx="6" fill="#120018" stroke="#ff00ff" stroke-width="2"/>
    <rect x="102" y="112" width="36" height="28" rx="6" fill="#120018" stroke="#ff00ff" stroke-width="2"/>
    <rect x="146" y="112" width="36" height="28" rx="6" fill="#120018" stroke="#ff00ff" stroke-width="2"/>
    <rect x="58" y="150" width="36" height="28" rx="6" fill="#001a1f" stroke="#00ffff" stroke-width="2"/>
    <rect x="102" y="150" width="36" height="28" rx="6" fill="#001a1f" stroke="#00ffff" stroke-width="2"/>
    <rect x="146" y="150" width="36" height="28" rx="6" fill="#1a0c00" stroke="#ff8c00" stroke-width="2"/>
  </g>
  <text x="76" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#ff00ff">+</text>
  <text x="120" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#ff00ff">-</text>
  <text x="164" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#ff00ff">x</text>
  <text x="76" y="170" text-anchor="middle" font-size="16" font-weight="800" fill="#00ffff">/</text>
  <text x="120" y="170" text-anchor="middle" font-size="16" font-weight="800" fill="#00ffff">=</text>
  <text x="164" y="170" text-anchor="middle" font-size="16" font-weight="800" fill="#ff8c00">?</text>
</svg>
