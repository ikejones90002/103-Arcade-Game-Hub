<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>PatternPop — by 103 Software Solutions LLC</title>
  <link rel="icon" href="patternpop.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-row">
          <img src="patternpop.svg" class="bee-mark" alt="">
          <h1>PatternPop</h1>
        </div>
        <p class="byline">Built by 103 Software Solutions LLC</p>
      </div>
      <div class="topbar-actions">
        <a class="btn secondary hub-link" href="index.html">103 Arcade</a>
        <button id="mute" class="icon-btn" type="button" aria-label="Mute sounds" title="Mute sounds">🔊</button>
      </div>
    </div>
    <section id="start-screen" class="card">
      <div class="bee-wrap"><img src="patternpop.svg" alt="PatternPop" class="bee hero"></div>
      <p class="howto">Look at the pattern. Tap what comes next.</p>
      <div class="difficulty" role="group">
        <button id="easy" class="active" type="button">Easy<small>Length 3</small></button>
        <button id="medium" type="button">Medium<small>Length 4</small></button>
        <button id="hard" type="button">Hard<small>Length 5</small></button>
      </div>
      <button id="play" class="btn" type="button">Play</button>
    </section>
    <section id="play-screen" class="card hidden">
      <div class="hud"><div class="score" id="score">Score: 0</div><div class="lives" id="lives"></div></div>
      <div class="streak" id="streak"></div>
      <div class="level-badge" id="level-badge">Easy · Length 3</div>
      <div class="timer" id="timer">Timer: 00</div>
      <div class="pattern-row" id="pattern"></div>
      <div class="actions" id="picks"></div>
    </section>
    <div id="leaderboard">
      <div class="lb-head"><h3>Leaderboard</h3><button id="clear-lb" class="btn secondary hidden" type="button">Clear</button></div>
      <div id="lb-body"></div>
    </div>
    <footer class="site-footer">
      <img src="logo.png" alt="103 Software Solutions LLC">
      <p>&copy; 2026 PatternPop. Built by <strong>103 Software Solutions LLC</strong>. All Rights Reserved.</p>
    </footer>
  </div>
  <div id="celebrate" aria-hidden="true"></div>
  <div id="confirm" class="overlay hidden"><div class="overlay-card">
    <h2>Clear leaderboard?</h2><p>This removes all saved scores on this device.</p>
    <div class="actions"><button id="confirm-no" class="btn secondary" type="button">Cancel</button><button id="confirm-yes" class="btn" type="button">Clear</button></div>
  </div></div>
  <div id="overlay" class="overlay hidden"><div class="overlay-card">
    <h2 id="overlay-title"></h2><p id="overlay-msg"></p>
    <div id="overlay-form" class="hidden"><label for="name-input">Your name</label><input id="name-input" maxlength="16" placeholder="Your name"></div>
    <button id="overlay-btn" class="btn" type="button">Continue</button>
  </div></div>
  <audio id="snd-correct" src="sounds/correct.mp3" preload="auto"></audio>
  <audio id="snd-wrong" src="sounds/wrong.mp3" preload="auto"></audio>
  <audio id="snd-tick" src="assets/audio/ui/tick.mp3" preload="auto"></audio>
  <script>
    const SHAPES=["circle","square","triangle"];
    const LEVELS={ easy:{label:"Easy",grades:"Length 3",time:20,len:3}, medium:{label:"Medium",grades:"Length 4",time:16,len:4}, hard:{label:"Hard",grades:"Length 5",time:12,len:5} };
    const PARTY=5, CHAMP=10;
    const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const muteBtn=document.getElementById("mute"), startScreen=document.getElementById("start-screen"), playScreen=document.getElementById("play-screen");
    const scoreDisplay=document.getElementById("score"), livesEl=document.getElementById("lives"), streakDisplay=document.getElementById("streak");
    const timerDisplay=document.getElementById("timer"), levelBadge=document.getElementById("level-badge");
    const patternEl=document.getElementById("pattern"), picksEl=document.getElementById("picks");
    const overlay=document.getElementById("overlay"), overlayTitle=document.getElementById("overlay-title"), overlayMsg=document.getElementById("overlay-msg");
    const overlayForm=document.getElementById("overlay-form"), overlayBtn=document.getElementById("overlay-btn"), nameInput=document.getElementById("name-input");
    const clearLbBtn=document.getElementById("clear-lb"), confirmEl=document.getElementById("confirm"), celebrateEl=document.getElementById("celebrate");
    const diffBtns={ easy:document.getElementById("easy"), medium:document.getElementById("medium"), hard:document.getElementById("hard") };
    let muted=localStorage.getItem("patternpop_mute")==="1";
    let leaderboard=JSON.parse(localStorage.getItem("patternpop_lb")||"[]");
    let difficulty="easy", score=0, lives=3, streak=0, timer=null, timeLeft=0, audioCtx=null, overlayCallback=null, roundActive=false;
    let motif=[], shown=[], answer="";

    function getCtx(){ const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; if(!audioCtx) audioCtx=new C(); if(audioCtx.state==="suspended") audioCtx.resume(); return audioCtx; }
    function tone(f,d,t,g,s){ if(muted) return; try{ const ctx=getCtx(); if(!ctx) return; const now=ctx.currentTime+(s||0); const o=ctx.createOscillator(), gn=ctx.createGain(); o.type=t||"sine"; o.frequency.setValueAtTime(f,now); gn.gain.setValueAtTime(g||0.07,now); gn.gain.exponentialRampToValueAtTime(0.001,now+d); o.connect(gn); gn.connect(ctx.destination); o.start(now); o.stop(now+d);}catch(e){} }
    function playMp3(id,v){ if(muted) return; const el=document.getElementById(id); try{ el.volume=v==null?1:v; el.currentTime=0; const p=el.play(); if(p&&p.catch)p.catch(()=>{});}catch(e){} }
    function playSfx(k){ if(muted) return; if(k==="click") tone(880,0.05,"triangle",0.05); else if(k==="sparkle"){tone(784,0.1,"sine",0.06);tone(1174,0.16,"sine",0.07,0.1);} else if(k==="fanfare"){tone(523,0.12,"square",0.05);tone(784,0.2,"square",0.05,0.14);} else if(k==="life"){tone(330,0.12,"triangle",0.07);tone(220,0.18,"triangle",0.07,0.1);} else if(k==="wrongBuzz") tone(140,0.2,"sawtooth",0.05); }
    function playSound(n){ if(n==="correct"){ playMp3("snd-correct",0.85); if(streak>=3) playSfx("sparkle"); } else if(n==="wrong"){ playMp3("snd-wrong",0.45); playSfx("wrongBuzz"); } else if(n==="tick") playMp3("snd-tick",0.55); else playSfx(n); }
    function updateMuteUi(){ muteBtn.textContent=muted?"🔇":"🔊"; }
    muteBtn.onclick=function(){ muted=!muted; localStorage.setItem("patternpop_mute", muted?"1":"0"); updateMuteUi(); if(!muted) playSfx("click"); };
    document.querySelectorAll("button").forEach(b=>{ if(b.id!=="mute") b.addEventListener("click",()=>playSfx("click")); });
    function sanitize(n){ return String(n||"").replace(/<[^>]*>/g,"").replace(/[^\w\s'-]/g,"").trim().slice(0,16); }
    function saveScore(name,val){ const c=sanitize(name); if(!c) return; leaderboard.push({name:c,score:val,date:Date.now()}); leaderboard.sort((a,b)=>b.score-a.score); leaderboard=leaderboard.slice(0,10); localStorage.setItem("patternpop_lb", JSON.stringify(leaderboard)); }
    function renderLeaderboard(){ const body=document.getElementById("lb-body"); body.replaceChildren(); clearLbBtn.classList.toggle("hidden", !leaderboard.length); if(!leaderboard.length){ const p=document.createElement("p"); p.className="empty"; p.textContent="No scores yet. Play a round to get on the board!"; body.appendChild(p); return;} const ol=document.createElement("ol"); leaderboard.forEach(e=>{ const li=document.createElement("li"); li.textContent=e.name+": "+e.score; ol.appendChild(li); }); body.appendChild(ol); }
    function setDiff(d){ difficulty=d; for(const k in diffBtns) diffBtns[k].classList.remove("active"); diffBtns[d].classList.add("active"); const L=LEVELS[d]; levelBadge.textContent=L.label+" · "+L.grades; }
    diffBtns.easy.onclick=()=>setDiff("easy"); diffBtns.medium.onclick=()=>setDiff("medium"); diffBtns.hard.onclick=()=>setDiff("hard");
    function renderLives(){ livesEl.replaceChildren(); for(let i=0;i<3;i++){ const s=document.createElement("span"); s.className="life"+(i>=lives?" gone":""); s.textContent="💛"; livesEl.appendChild(s);} }
    function updateHud(){ scoreDisplay.textContent="Score: "+score; streakDisplay.textContent=streak>=2?"Streak: "+streak:""; renderLives(); }
    function flash(kind){ playScreen.classList.remove("ok","bad","shake"); playScreen.classList.add(kind==="ok"?"ok":"bad"); if(kind!=="ok"&&!reduceMotion) playScreen.classList.add("shake"); setTimeout(()=>playScreen.classList.remove("ok","bad","shake"),700); }
    function confetti(){ if(reduceMotion) return; const colors=["#ff8c00","#ffff00","#32cd32","#00ffff","#ff00ff"]; for(let i=0;i<16;i++){ const d=document.createElement("span"); d.className="confetti"; d.style.left=Math.random()*90+5+"%"; d.style.background=colors[i%colors.length]; playScreen.appendChild(d); setTimeout(()=>d.remove(),1000);} }
    function celebrate(big){ if(reduceMotion) return; const colors=["#ff8c00","#ffff00","#32cd32","#00ffff","#ff00ff"]; celebrateEl.replaceChildren(); for(let i=0;i<(big?16:10);i++){ const r=document.createElement("span"); r.className="streamer"; r.style.left=(4+i*6)+"%"; r.style.height=40+Math.random()*24+"vh"; r.style.background="linear-gradient(180deg,"+colors[i%colors.length]+",transparent)"; r.style.color=colors[i%colors.length]; celebrateEl.appendChild(r);} for(let i=0;i<(big?80:40);i++){ const b=document.createElement("span"); b.className="party-confetti"; b.style.left=Math.random()*100+"%"; b.style.background=colors[i%colors.length]; b.style.setProperty("--drift",(Math.random()*160-80)+"px"); celebrateEl.appendChild(b);} playSfx(big?"fanfare":"sparkle"); setTimeout(()=>celebrateEl.replaceChildren(), big?4500:3000); }
    function showOverlay(o){ overlayTitle.textContent=o.title; overlayMsg.textContent=o.message; overlayBtn.textContent=o.button||"Continue"; overlayForm.classList.toggle("hidden", !o.askName); overlay.classList.remove("hidden"); overlayCallback=o.onContinue||null; if(o.askName){ nameInput.value=""; nameInput.focus(); } else overlayBtn.focus(); }
    function hideOverlay(){ overlay.classList.add("hidden"); const cb=overlayCallback; overlayCallback=null; if(cb) cb(); }
    overlayBtn.onclick=function(){ if(!overlayForm.classList.contains("hidden")){ saveScore(sanitize(nameInput.value)||"Player", score); renderLeaderboard(); } hideOverlay(); };
    function token(shape, extra){ const el=document.createElement("div"); el.className="shape-token "+shape+(extra?" "+extra:""); if(shape==="q") el.textContent="?"; return el; }
    function nextRound(){
      const L=LEVELS[difficulty];
      const n=2+Math.floor(Math.random()*2);
      motif=[]; for(let i=0;i<n;i++) motif.push(SHAPES[Math.floor(Math.random()*SHAPES.length)]);
      shown=[]; while(shown.length<L.len) shown.push(motif[shown.length%motif.length]);
      answer=motif[shown.length%motif.length];
      patternEl.replaceChildren();
      shown.forEach(s=>patternEl.appendChild(token(s)));
      patternEl.appendChild(token("q"));
      picksEl.replaceChildren();
      SHAPES.forEach(s=>{
        const b=document.createElement("button"); b.className="btn shape-pick"; b.type="button";
        const inner=token(s); inner.style.pointerEvents="none"; b.appendChild(inner);
        b.onclick=function(){ if(!roundActive) return; if(s===answer) handleCorrect(); else handleMiss("The next shape did not match the pattern."); };
        picksEl.appendChild(b);
      });
      roundActive=true; startTimer(L.time);
    }
    function startTimer(sec){ if(timer) clearInterval(timer); timeLeft=sec; timerDisplay.classList.remove("urgent"); timerDisplay.textContent="Timer: "+timeLeft; timer=setInterval(()=>{ timeLeft--; if(timeLeft<=5){ timerDisplay.classList.add("urgent"); playSound("tick"); } timerDisplay.textContent="Timer: "+(timeLeft<10?"0":"")+Math.max(timeLeft,0); if(timeLeft<=0){ clearInterval(timer); handleMiss("Time is up!"); } },1000); }
    function stopTimer(){ if(timer) clearInterval(timer); timer=null; timerDisplay.classList.remove("urgent"); }
    function handleCorrect(){ if(!roundActive) return; roundActive=false; stopTimer(); score++; streak++; updateHud(); playSound("correct"); confetti(); flash("ok"); if(score===PARTY||score===CHAMP) celebrate(score>=CHAMP); setTimeout(()=>{ if(lives>0) nextRound(); },800); }
    function handleMiss(msg){ if(!roundActive) return; roundActive=false; stopTimer(); streak=0; lives--; updateHud(); flash("bad"); if(lives>0){ playSfx("life"); playSound("wrong"); showOverlay({ title:"Oops!", message:msg+" Lives left: "+lives+".", button:"Next", onContinue:nextRound }); } else { playSound("wrong"); endGame(msg); } }
    function startRound(){ getCtx(); score=0; lives=3; streak=0; startScreen.classList.add("hidden"); playScreen.classList.remove("hidden"); updateHud(); nextRound(); }
    function goHome(){ stopTimer(); roundActive=false; playScreen.classList.add("hidden"); startScreen.classList.remove("hidden"); }
    function endGame(msg){ stopTimer(); if(score>=CHAMP) celebrate(true); else if(score>=PARTY) celebrate(false); playSfx("fanfare"); showOverlay({ title:score>=CHAMP?"Champion!":"PatternPop over!", message:(msg?msg+" ":"")+"You scored "+score+" point"+(score===1?"":"s")+". Add your name to the leaderboard.", button:"Save score", askName:true, onContinue:goHome }); }
    document.getElementById("play").onclick=startRound;
    clearLbBtn.onclick=()=>confirmEl.classList.remove("hidden");
    document.getElementById("confirm-no").onclick=()=>confirmEl.classList.add("hidden");
    document.getElementById("confirm-yes").onclick=()=>{ leaderboard=[]; localStorage.removeItem("patternpop_lb"); renderLeaderboard(); confirmEl.classList.add("hidden"); };
    document.addEventListener("keydown", e=>{ if(e.key!=="Escape") return; if(!confirmEl.classList.contains("hidden")){ confirmEl.classList.add("hidden"); return;} if(!overlay.classList.contains("hidden")) overlayBtn.click(); });
    nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter") overlayBtn.click(); });
    updateMuteUi(); renderLeaderboard(); setDiff("easy");
  </script>
</body>
</html>
