  <path d="M132 80 L172 88" fill="none" stroke="#00ffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 100 L172 108" fill="none" stroke="#00ffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="36" r="14" fill="#05050a" stroke="#ff8c00" stroke-width="3" filter="url(#glow)"/>
  <path d="M120 28 L123 34 L130 35 L124 39 L126 46 L120 42 L114 46 L116 39 L110 35 L117 34 Z" fill="#ffff00"/>
